{% extends "base.html" %}
{% block title %}Login | NovaCart{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Access your cart and order history.</p>
<form method="post" class="stack-form">{% csrf_token %}
{% if form.errors %}<p class="error">Username or password is incorrect.</p>{% endif %}
<label>Username{{ form.username }}</label><label>Password{{ form.password }}</label>
<input type="hidden" name="next" value="{{ next }}">
<button class="button full" type="submit">Log in</button></form><p class="auth-foot">New to NovaCart? <a href="{% url 'signup' %}">Create account</a></p></div></section>
{% endblock %}
